name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ci:
    name: CI Check
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Staging
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:staging
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO: Add deployment steps for your hosting provider
      # Examples:
      #   - Railway: railway up
      #   - Fly.io: flyctl deploy
      #   - AWS ECS: update task definition + service
      #   - Self-hosted: SSH + docker pull + docker compose up

      - name: Deployment placeholder
        run: |
          echo "Docker image pushed to ghcr.io/${{ github.repository }}:staging"
          echo "TODO: Add deployment commands for your hosting provider"
