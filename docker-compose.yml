services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docere
      POSTGRES_USER: docere
      POSTGRES_PASSWORD: docere_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docere"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local Moodle for LTI testing (admin/Admin123!)
  moodle:
    image: bitnamilegacy/moodle:latest
    user: "0:0"
    environment:
      MOODLE_DATABASE_HOST: moodle-mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_PASSWORD: moodle_dev
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: "Admin123!"
      MOODLE_EMAIL: admin@localhost.com
      MOODLE_SITE_NAME: "Docere Test Moodle"
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata:/bitnami/moodledata
    depends_on:
      moodle-mariadb:
        condition: service_healthy

  moodle-mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root_dev
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: moodle_dev
    volumes:
      - moodle_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  qdrant_data:
  moodle_data:
  moodledata:
  moodle_db_data:
