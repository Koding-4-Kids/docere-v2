[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docere"
version = "0.1.0"
description = "Memory-augmented, self-improving learning agent for LMS integration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Youdahe Asfaw" },
    { name = "Kofi Osei" },
    { name = "Guarionex Salivia" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.40.0",
    "qdrant-client>=1.12.0",
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.10.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "coverage>=7.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
